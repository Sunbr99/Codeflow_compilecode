name: Android Build CI - MW CodeFlow

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build MW CodeFlow Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js (v22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: ☕ Setup Java JDK (v21 Zulu)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: 🤖 Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: 📚 Install Project Dependencies
        run: |
          npm install --legacy-peer-deps --no-audit

      - name: 🔍 Verify Codebase Health & Types
        run: |
          npm run lint

      - name: 🔨 Build Web Application Bundle (Vite)
        run: |
          npm run build:web

      - name: 📱 Initialize and Sync Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: 🎨 Install MW Cyber Icons into Android Launcher Resources
        run: |
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            res_dir="android/app/src/main/res/mipmap-$density"
            if [ -d "$res_dir" ]; then
              cp public/pwa-512x512.png "$res_dir/ic_launcher.png" 2>/dev/null || true
              cp public/pwa-512x512.png "$res_dir/ic_launcher_round.png" 2>/dev/null || true
              cp public/pwa-512x512.png "$res_dir/ic_launcher_foreground.png" 2>/dev/null || true
            fi
          done
          # Remove duplicate PNG files from anydpi-v26 to prevent duplicate resource XML collisions
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.png 2>/dev/null || true
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.png 2>/dev/null || true

      - name: ⚙️ Configure Android SDK 34 & Clean Build Config
        run: |
          if [ -f "android/variables.gradle" ]; then
            sed -i 's/compileSdkVersion = 36/compileSdkVersion = 34/g' android/variables.gradle
            sed -i 's/targetSdkVersion = 36/targetSdkVersion = 34/g' android/variables.gradle
          fi
          if [ -f "android/app/build.gradle" ]; then
            sed -i '/daemonAapt2Executable/d' android/app/build.gradle 2>/dev/null || true
          fi

      - name: 🚀 Build Debug APK via Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 📤 Upload MW CodeFlow APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MW-CodeFlow-Cyber-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: 📋 Display Build Output Summary
        run: |
          echo "=========================================================="
          echo "🎉 Android APK Built Successfully!"
          echo "File: $(ls android/app/build/outputs/apk/debug/*.apk)"
          echo "=========================================================="
