<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="cyberBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040711"/>
      <stop offset="50%" stop-color="#0a1022"/>
      <stop offset="100%" stop-color="#140728"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="neonViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e879f9"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <linearGradient id="chromeMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#93c5fd"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="75%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background with smooth rounded edges -->
  <rect width="512" height="512" rx="112" fill="url(#cyberBg)"/>
  <rect x="14" y="14" width="484" height="484" rx="100" fill="none" stroke="#1e293b" stroke-width="3"/>
  <rect x="22" y="22" width="468" height="468" rx="92" fill="none" stroke="url(#neonCyan)" stroke-width="2.5" opacity="0.6"/>

  <!-- Cyber Hex Outer Shield -->
  <polygon points="256,48 430,128 430,345 256,450 82,345 82,128" fill="#060c1c" stroke="url(#neonViolet)" stroke-width="4" opacity="0.75"/>
  <polygon points="256,66 410,138 410,332 256,430 102,332 102,138" fill="none" stroke="url(#neonCyan)" stroke-width="2" opacity="0.4" stroke-dasharray="14 7"/>

  <!-- Cybernetic Demon Horns Left (Violet) -->
  <path d="M 195 180 Q 155 95 125 65 Q 185 105 210 165 Z" fill="url(#neonViolet)" filter="url(#neonGlow)"/>
  <path d="M 180 160 L 140 100 L 165 145" fill="none" stroke="#f5d0fe" stroke-width="2" opacity="0.8"/>

  <!-- Cybernetic Demon Horns Right (Cyan) -->
  <path d="M 317 180 Q 357 95 387 65 Q 327 105 302 165 Z" fill="url(#neonCyan)" filter="url(#neonGlow)"/>
  <path d="M 332 160 L 372 100 L 347 145" fill="none" stroke="#cffafe" stroke-width="2" opacity="0.8"/>

  <!-- Mecha Beast Forehead / Crest Armor -->
  <polygon points="256,105 292,145 272,175 256,160 240,175 220,145" fill="#1e293b" stroke="url(#neonCyan)" stroke-width="3"/>
  <polygon points="256,120 274,148 256,138 238,148" fill="#00f0ff" opacity="0.9" filter="url(#neonGlow)"/>

  <!-- Glowing Cyan Eyes -->
  <polygon points="185,200 230,212 222,220 180,206" fill="#00f0ff" filter="url(#neonGlow)"/>
  <polygon points="327,200 282,212 290,220 332,206" fill="#00f0ff" filter="url(#neonGlow)"/>

  <!-- Bold Stylized "MW" Cyber Monogram Emblem -->
  <!-- "M" Character -->
  <g filter="url(#neonGlow)">
    <path d="M 115 350 L 115 225 L 155 225 L 185 290 L 215 225 L 255 225 L 255 350 L 225 350 L 225 265 L 195 330 L 175 330 L 145 265 L 145 350 Z" 
          fill="url(#chromeMetal)" stroke="url(#neonCyan)" stroke-width="4" stroke-linejoin="bevel"/>
  </g>

  <!-- "W" Character -->
  <g filter="url(#neonGlow)">
    <path d="M 260 225 L 290 225 L 315 315 L 345 240 L 375 240 L 405 315 L 430 225 L 460 225 L 420 350 L 390 350 L 360 275 L 330 350 L 300 350 Z" 
          fill="url(#chromeMetal)" stroke="url(#neonViolet)" stroke-width="4" stroke-linejoin="bevel"/>
  </g>

  <!-- Circuit Matrix Traces -->
  <polyline points="185,365 185,395 230,415" fill="none" stroke="url(#neonCyan)" stroke-width="3" stroke-linecap="round"/>
  <polyline points="327,365 327,395 282,415" fill="none" stroke="url(#neonViolet)" stroke-width="3" stroke-linecap="round"/>
  <circle cx="230" cy="415" r="4" fill="#00f0ff"/>
  <circle cx="282" cy="415" r="4" fill="#c084fc"/>

  <!-- Bottom Brand Text -->
  <text x="256" y="482" fill="#00f0ff" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" text-anchor="middle" letter-spacing="8">MW CYBER LOGO</text>
</svg>
