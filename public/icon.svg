<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="code" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <!-- Background with smooth rounded edges -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#334155" stroke-width="4"/>

  <!-- Pulse Hexagon Circuit -->
  <polygon points="256,70 396,150 396,310 256,390 116,310 116,150" fill="none" stroke="url(#glow)" stroke-width="8" stroke-dasharray="16 8" opacity="0.4"/>

  <!-- Code Bracket Left < -->
  <path d="M 180 180 L 110 256 L 180 332" fill="none" stroke="url(#code)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Code Bracket Right > -->
  <path d="M 332 180 L 402 256 L 332 332" fill="none" stroke="url(#code)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Decompiler Slash / Arrow Flow -->
  <path d="M 284 165 L 228 347" fill="none" stroke="#f59e0b" stroke-width="22" stroke-linecap="round"/>

  <!-- Flow Particle Dots -->
  <circle cx="256" cy="256" r="14" fill="#10b981"/>
  <circle cx="256" cy="190" r="8" fill="#38bdf8"/>
  <circle cx="256" cy="322" r="8" fill="#34d399"/>

  <!-- Terminal Symbol at bottom -->
  <text x="256" y="445" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" text-anchor="middle" letter-spacing="4">CODEFLOW</text>
</svg>
